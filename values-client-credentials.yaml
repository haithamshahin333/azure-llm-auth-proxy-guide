# LangSmith LLM auth proxy -> Azure AI Foundry, authenticating with the OAuth2 client_credentials grant (client id +
# secret) at Entra or at any token endpoint you name (API Management, another IdP). Use values-workload-identity.yaml
# instead when the cluster has workload identity: no secret exists anywhere then.
# Values for the upstream chart langchain/langsmith-auth-proxy (pinned 0.0.15). Fill in every <placeholder>, create the
# Secret, then:
#   kubectl create secret generic llm-auth-proxy-oauth -n <namespace> --from-file=OAUTH_CLIENT_SECRET=<secret-file>
#   helm upgrade --install llm-auth-proxy langchain/langsmith-auth-proxy --version 0.0.15 \
#     -n <namespace> --create-namespace -f values-client-credentials.yaml --wait --timeout 3m
fullnameOverride: llm                          # every object renders as llm-auth-proxy (Service, ServiceAccount, Deployment)
authProxy:
  # WHERE THE MODEL REQUEST GOES. Foundry directly: https://<foundry-account>.openai.azure.com, no path. (The account's endpoint
  # shown by Azure may end in .cognitiveservices.azure.com; use the .openai.azure.com form here.)
  # A gateway in front of the model provider instead: https://<gateway-host>[/<base-path>]; the request path is appended after
  # the base path, Host/SNI are rewritten to that host, and OAUTH_TOKEN_URL/OAUTH_SCOPE below must be what the gateway expects (README).
  upstream: "https://<foundry-account>.openai.azure.com"
  jwtIssuer: "langsmith:self-hosted:<yours>"               # must equal config.llmAuthProxyIssuer in langsmith-values.yaml
  jwtAudiences: ["llm-auth-proxy"]                         # must equal "JWT audience" in the LangSmith organization setting
  # Public signing key, fetched in-cluster from the LangSmith frontend Service (kubectl get svc -n <langsmith-namespace> | grep frontend).
  jwksUri: "http://<langsmith-release>-frontend.<langsmith-namespace>.svc.cluster.local:80/.well-known/jwks.json"
  jwksCacheDurationSeconds: 300
  extAuthz:
    enabled: true
    serviceUrl: "http://localhost:10002"       # the sidecar below; Envoy calls <serviceUrl>/check<path> for every request
    timeout: "10s"
  serviceAccount:
    annotations: {}
  deployment:
    replicas: 1                                # raise it, or enable authProxy.autoscaling.hpa, for production
    labels: {}
    sidecars:
      - name: authz
        image: "<registry>/langsmith-llm-authz:1"   # built from authz/Dockerfile (README step 4)
        env:
          - name: OAUTH_TOKEN_URL              # Entra: this URL with your tenant id; otherwise your gateway's or IdP's token endpoint (https)
            value: "https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/token"
          - name: OAUTH_CLIENT_ID              # application (client) id of your app registration, or your gateway's client id
            value: "<client-id>"
          - name: OAUTH_SCOPE                  # Entra wants <resource>/.default; set it to "" for a token endpoint that takes no scope
            value: "https://cognitiveservices.azure.com/.default"
          - name: OAUTH_CLIENT_AUTH            # post = client_secret_post (Entra) | basic = client_secret_basic
            value: "post"
          # - name: LOG_HEADERS                # every call logs the forwarded headers (credentials redacted) and the JWT claims;
          #   value: "false"                   # set false for a compact line
          - name: OAUTH_CLIENT_SECRET          # the only secret, from the Kubernetes Secret you created (see the top of this file)
            valueFrom:
              secretKeyRef:
                name: llm-auth-proxy-oauth
                key: OAUTH_CLIENT_SECRET
        ports:
          - name: authz
            containerPort: 10002
        readinessProbe:                        # 200 only when a token was minted (cached: one real request per token lifetime)
          httpGet: { path: /healthz, port: 10002 }
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 15                   # a first mint can take a few seconds
          failureThreshold: 3
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 128Mi }
ingress:
  enabled: false                               # in-cluster only; see README "Operations" for TLS
gateway:
  enabled: false
